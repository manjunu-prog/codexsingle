name: Option flow history backup

on:
  workflow_dispatch:
  schedule:
    # 08:00 to 08:55 IST (02:30 to 02:55 UTC)
    - cron: "30,35,40,45,50,55 2 * * 1-5"

    # 09:00 to 15:55 IST (03:00 to 09:55 UTC)
    - cron: "*/5 3-9 * * 1-5"

    # 16:00 to 16:30 IST (10:00 to 10:30 UTC)
    - cron: "0,5,10,15,20,25,30 10 * * 1-5"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_APP_SECRET: ${{ secrets.FYERS_APP_SECRET }}
      FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPTION_FLOW_SYMBOL: NSE:NIFTY50-INDEX
      OPTION_FLOW_STRIKECOUNT: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Check IST market window
        id: market_window
        run: |
          hour=$(TZ=Asia/Kolkata date +%H)
          minute=$(TZ=Asia/Kolkata date +%M)
          total=$((10#$hour * 60 + 10#$minute))
          if [ "$total" -ge 480 ] && [ "$total" -le 960 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 08:00-16:00 IST collection window."
          fi
      - name: Collect option flow
        if: steps.market_window.outputs.run == 'true'
        run: PYTHONPATH=. python scripts/collect_option_flow.py
