name: Option flow history backup

on:
  workflow_dispatch:
  schedule:
    # GitHub's hosted scheduler has a documented five-minute minimum.
    - cron: "*/5 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      FYERS_FY_ID: ${{ secrets.FYERS_FY_ID }}
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      FYERS_APP_SECRET: ${{ secrets.FYERS_APP_SECRET }}
      FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
      FYERS_PIN: ${{ secrets.FYERS_PIN }}
      FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPTION_FLOW_SYMBOL: NSE:NIFTY50-INDEX
      OPTION_FLOW_STRIKECOUNT: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/collect_option_flow.py
